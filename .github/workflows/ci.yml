name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: Verificações e testes automatizados
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oficina
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DEBUG: "True"
      SECRET_KEY: chave-somente-para-o-ci
      POSTGRES_DB: oficina
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar configuração do Django
        run: python manage.py check

      - name: Verificar se há migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar testes unitários e de integração
        run: python manage.py test --verbosity 2

      - name: Gerar arquivos estáticos como em produção (collectstatic)
        env:
          DEBUG: "False"
          SECRET_KEY: ${{ github.run_id }}-chave-temporaria-do-ci-com-mais-de-cinquenta-caracteres-aleatorios
        run: python manage.py collectstatic --no-input

      - name: Verificar configuração de produção (check --deploy)
        env:
          DEBUG: "False"
          SECRET_KEY: ${{ github.run_id }}-chave-temporaria-do-ci-com-mais-de-cinquenta-caracteres-aleatorios
          ALLOWED_HOSTS: exemplo.onrender.com
        run: python manage.py check --deploy --fail-level WARNING

  dependencias:
    name: Auditoria de dependências (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verificar vulnerabilidades conhecidas
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
